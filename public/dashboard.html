<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints — ResolveX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">
      <span class="brand-mark">R</span>
      <span>ResolveX</span>
    </a>
    <div class="nav-links">
      <span id="navUserBadge" class="user-pill"></span>
      <a href="complaint.html" class="btn btn-sm">+ New Complaint</a>
      <a href="index.html" id="logout" class="nav-link">Logout</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-top">
      <div>
        <h1>My Complaints</h1>
        <p class="page-subtitle">Track live status, assigned departments, and SLA progress</p>
      </div>
      <a href="complaint.html" class="btn">+ Submit Complaint</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Submitted</div>
        <div class="stat-value" id="myTotal">0</div>
      </div>
      <div class="stat-card warn">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="myPending">0</div>
      </div>
      <div class="stat-card info">
        <div class="stat-label">In Progress</div>
        <div class="stat-value" id="myProgress">0</div>
      </div>
      <div class="stat-card success">
        <div class="stat-label">Resolved</div>
        <div class="stat-value" id="myResolved">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Search by title, category, or location...">
        <select id="statusFilter">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Department</th>
              <th>Priority</th>
              <th>Status</th>
              <th>SLA</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="complaintList"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span id="pageInfo">Page 1 of 1</span>
        <div class="pagination-controls">
          <button class="btn-outline btn-sm" id="prevPage">Previous</button>
          <button class="btn-outline btn-sm" id="nextPage">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
