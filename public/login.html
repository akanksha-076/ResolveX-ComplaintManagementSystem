<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ResolveX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">
      <span class="brand-mark">R</span>
      <span>ResolveX</span>
    </a>
    <div class="nav-links">
      <a href="register.html" class="btn btn-sm">Get Started</a>
    </div>
  </nav>

  <section class="form-box">
    <h1>Welcome Back</h1>
    <p class="form-desc">Sign in with your ResolveX account</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@university.edu" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>

    <p class="small">New here? <a href="register.html">Create a student account</a></p>
  </section>

  <script src="ui.js"></script>
  <script src="login.js"></script>
</body>
</html>
