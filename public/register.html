<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ResolveX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">
      <span class="brand-mark">R</span>
      <span>ResolveX</span>
    </a>
    <div class="nav-links">
      <a href="login.html" class="nav-link">Login</a>
    </div>
  </nav>

  <section class="form-box">
    <h1>Create Account</h1>
    <p class="form-desc">Register as a student to report and track campus complaints</p>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@university.edu" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 4 characters" minlength="4" required>

      <button type="submit" class="btn" id="regBtn">Create Account</button>
    </form>

    <p class="small">Already have an account? <a href="login.html">Sign in</a></p>
  </section>

  <script src="ui.js"></script>
  <script src="register.js"></script>
</body>
</html>
