<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Details — ResolveX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">
      <span class="brand-mark">R</span>
      <span>ResolveX</span>
    </a>
    <div class="nav-links">
      <span id="navUserBadge" class="user-pill"></span>
      <a href="dashboard.html" id="backLink" class="nav-link">Back to Dashboard</a>
      <a href="index.html" id="logout" class="nav-link">Logout</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-top">
      <div>
        <h1>Complaint #<span id="cId"></span> <span id="cStatusBadge"></span></h1>
        <p class="page-subtitle" id="cSubtitle">Loading complaint details...</p>
      </div>
      <div id="cSlaBadge"></div>
    </div>

    <div class="details-grid">
      <div>
        <div class="panel">
          <h2 id="cTitle" style="margin-top:0;"></h2>
          <div class="meta-grid">
            <div class="meta-item"><small>Category</small><span id="cCategory">-</span></div>
            <div class="meta-item"><small>Department</small><span id="cDepartment">-</span></div>
            <div class="meta-item"><small>Location</small><span id="cLocation">-</span></div>
            <div class="meta-item"><small>Priority</small><span id="cPriority">-</span></div>
            <div class="meta-item"><small>Resolution Time</small><span id="cResolution">-</span></div>
            <div class="meta-item"><small>Submitted On</small><span id="cCreated">-</span></div>
          </div>
          <p style="margin-bottom:0;"><strong>Description:</strong><br><span id="cDescription" style="color:#475569;"></span></p>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3>Discussion</h3>
          </div>
          <div id="commentList"></div>
          <form id="commentForm" style="margin-top:14px;">
            <textarea id="commentText" rows="3" placeholder="Write a comment or update..." required></textarea>
            <button type="submit" class="btn btn-sm" style="margin-top:8px;">Post Comment</button>
          </form>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3>Student Feedback</h3>
          </div>
          <div id="feedbackBox"></div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-header">
            <h3>Status Updates</h3>
          </div>
          <div id="historyBox"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3>Activity Timeline</h3>
          </div>
          <div id="timelineBox"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="ui.js"></script>
  <script src="details.js"></script>
</body>
</html>
